services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: news_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d news_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  parser:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/news_db
      PARSING_INTERVAL_HOURS: 1
    depends_on:
      db:
        condition: service_healthy
    command: python app/services/scheduler.py

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/news_db
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000

  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/news_db
    depends_on:
      db:
        condition: service_healthy
    command: streamlit run app/dashboard/app.py --server.address 0.0.0.0

volumes:
  postgres_data:
